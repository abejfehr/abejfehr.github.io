<style>
  :root {
    --black: #555;
  }

  html {
    font-family: "Inter", sans-serif;
    font-optical-sizing: auto;
    font-style: normal;
    color: var(--black);
  }

  /* reset */
  html, body {
    margin: 0;
  }

  figure {
    margin: 0;
  }

  figcaption {
    font-style: italic;
    font-size: 12px;
    text-align: center;
  }

  img {
    max-width: 100%;
  }

  /* navbar styles */
  header {
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: auto 1fr auto;
  }
  @media screen and (max-width: 655px) {
    header {
      max-width: 650px;
      padding: 20px 20px;
    }
  }

  header > a {
    grid-column: 1;
  }

  header > nav {
    grid-column: 3;
  }

  header a {
    text-decoration: none;
    color: var(--black);
  }

  header nav a:hover {
    text-decoration: underline;
  }

  header > a {
    display: inline-block;
    font-weight: bold;
    font-size: 22px;
    transition: color 50ms linear;
  }

  header > a:hover {
    color: black;
  }

  nav {
    display: inline;
  }

  nav ul {
    display: inline;
  }

  nav ul li {
    display: inline;
  }

  /* Markdown */
  .highlighter-rouge {
    margin: 13px 0;
  }
  pre.highlight {
    margin: 0;
    padding: 20px;
  }

</style>
